<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KB Training">
<title>KB Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0a;
  --surface: #141414;
  --surface2: #1e1e1e;
  --surface3: #282828;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --text: #f0f0f0;
  --muted: #888;
  --dim: #555;
  --accent: #e8ff47;
  --accent-dim: rgba(232,255,71,0.12);
  --accent-dim2: rgba(232,255,71,0.06);
  --red: #ff4f4f;
  --red-dim: rgba(255,79,79,0.12);
  --orange: #ff8c3a;
  --orange-dim: rgba(255,140,58,0.12);
  --teal: #3affb8;
  --teal-dim: rgba(58,255,184,0.1);
  --blue: #5ab4ff;
  --blue-dim: rgba(90,180,255,0.1);
  --r: 10px;
  --r-sm: 6px;
  --tab-h: 64px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  overscroll-behavior: none;
}

/* ── LAYOUT ── */
.app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

.view { display: none; flex: 1; overflow-y: auto; padding-bottom: calc(var(--tab-h) + var(--safe-bottom) + 16px); }
.view.active { display: block; }

/* ── HEADER ── */
.header {
  padding: 52px 20px 16px;
  border-bottom: 1px solid var(--border);
}
.header-row { display: flex; align-items: flex-end; justify-content: space-between; }
.header-title { font-family: 'Bebas Neue', sans-serif; font-size: 36px; letter-spacing: 1px; line-height: 1; color: var(--text); }
.header-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
.header-badge {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 13px;
  letter-spacing: 1px;
  padding: 5px 10px;
  border-radius: 999px;
  background: var(--accent-dim);
  color: var(--accent);
  border: 1px solid rgba(232,255,71,0.2);
}

/* ── BOTTOM NAV ── */
.tabnav {
  height: calc(var(--tab-h) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: rgba(14,14,14,0.95);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border2);
  display: flex;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 100;
}
.tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4px; cursor: pointer; transition: opacity .15s; opacity: .45;
  -webkit-user-select: none; user-select: none;
}
.tab.active { opacity: 1; }
.tab svg { width: 22px; height: 22px; }
.tab span { font-size: 10px; font-weight: 500; letter-spacing: .3px; }
.tab.active span { color: var(--accent); }
.tab.active svg { stroke: var(--accent); }
.tab svg { stroke: var(--muted); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: stroke .15s; }

/* ── DAY SELECTOR ── */
.day-strip {
  display: flex; gap: 8px; padding: 16px 20px 0;
  overflow-x: auto; scrollbar-width: none;
}
.day-strip::-webkit-scrollbar { display: none; }
.day-chip {
  flex-shrink: 0; padding: 8px 16px; border-radius: 999px;
  border: 1px solid var(--border2); background: var(--surface);
  font-size: 13px; font-weight: 500; color: var(--muted);
  cursor: pointer; transition: all .15s; -webkit-user-select: none; user-select: none;
}
.day-chip.active {
  background: var(--accent); color: #111; border-color: var(--accent);
  font-weight: 600;
}

/* ── SECTION ── */
.section { padding: 20px 20px 0; }
.section-label {
  font-size: 10px; font-weight: 600; letter-spacing: .12em;
  text-transform: uppercase; color: var(--dim); margin-bottom: 10px;
}

/* ── EXERCISE CARD ── */
.ex-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); margin-bottom: 8px; overflow: hidden;
  transition: border-color .15s;
}
.ex-card:active { opacity: .85; }
.ex-main {
  display: flex; align-items: center; gap: 12px; padding: 13px 14px;
  cursor: pointer;
}
.ex-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.ex-body { flex: 1; min-width: 0; }
.ex-name { font-size: 14px; font-weight: 500; color: var(--text); }
.ex-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
.ex-reps {
  font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: .5px;
  color: var(--text); flex-shrink: 0;
}
.ex-chevron {
  width: 16px; height: 16px; flex-shrink: 0; stroke: var(--dim);
  fill: none; stroke-width: 2; stroke-linecap: round; transition: transform .2s;
}

/* ── LOG PANEL (inside card) ── */
.log-panel {
  display: none; border-top: 1px solid var(--border);
  padding: 14px 14px 14px;
  background: var(--surface2);
}
.log-panel.open { display: block; }

.log-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.log-set-num {
  font-family: 'Bebas Neue', sans-serif; font-size: 15px; color: var(--dim);
  width: 20px; flex-shrink: 0; text-align: center;
}
.log-input {
  flex: 1; background: var(--surface3); border: 1px solid var(--border2);
  border-radius: var(--r-sm); padding: 8px 10px; color: var(--text);
  font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500;
  outline: none; transition: border-color .15s; -webkit-appearance: none;
  text-align: center;
}
.log-input:focus { border-color: var(--accent); }
.log-input::placeholder { color: var(--dim); font-weight: 400; }
.log-label { font-size: 11px; color: var(--dim); width: 28px; text-align: center; flex-shrink: 0; }

.log-headers {
  display: flex; gap: 8px; margin-bottom: 6px; padding-left: 28px;
}
.log-h { flex: 1; font-size: 10px; color: var(--dim); text-align: center; letter-spacing: .08em; text-transform: uppercase; }

.log-prev {
  font-size: 11px; color: var(--muted); margin-top: 10px; padding-top: 10px;
  border-top: 1px solid var(--border);
}
.log-prev-label { color: var(--dim); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
.prev-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.prev-chip {
  font-size: 11px; padding: 3px 8px; border-radius: 4px;
  background: var(--surface3); color: var(--muted);
}
.prev-chip.pr { background: var(--accent-dim); color: var(--accent); }

.save-btn {
  width: 100%; margin-top: 12px; padding: 11px;
  background: var(--accent); color: #111; border: none; border-radius: var(--r-sm);
  font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 1px;
  cursor: pointer; transition: opacity .15s; -webkit-appearance: none;
}
.save-btn:active { opacity: .8; }

/* ── DAY HEADER CARD ── */
.day-header-card {
  margin: 14px 20px 0;
  padding: 14px 16px; border-radius: var(--r);
  border: 1px solid var(--border2);
  display: flex; align-items: center; gap: 12px;
}
.day-header-icon {
  width: 40px; height: 40px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  font-family: 'Bebas Neue', sans-serif; font-size: 15px; letter-spacing: 1px;
}
.day-header-info { flex: 1; }
.day-header-title { font-size: 14px; font-weight: 600; color: var(--text); }
.day-header-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
.day-header-time { font-family: 'Bebas Neue', sans-serif; font-size: 13px; letter-spacing: .5px; color: var(--dim); }

/* ── PROGRESS VIEW ── */
.prog-header { padding: 52px 20px 20px; border-bottom: 1px solid var(--border); }
.prog-title { font-family: 'Bebas Neue', sans-serif; font-size: 36px; letter-spacing: 1px; }
.prog-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }

.prog-day-select {
  display: flex; gap: 8px; padding: 16px 20px 0; overflow-x: auto; scrollbar-width: none;
}
.prog-day-select::-webkit-scrollbar { display: none; }
.prog-chip {
  flex-shrink: 0; padding: 7px 14px; border-radius: 999px;
  border: 1px solid var(--border2); background: var(--surface);
  font-size: 12px; font-weight: 500; color: var(--muted); cursor: pointer; transition: all .15s;
}
.prog-chip.active { border-color: var(--blue); background: var(--blue-dim); color: var(--blue); }

.prog-section { padding: 16px 20px 0; }
.prog-ex-block {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); margin-bottom: 10px; overflow: hidden;
}
.prog-ex-name {
  padding: 12px 14px 10px; font-size: 13px; font-weight: 600; color: var(--text);
  border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;
}
.prog-ex-name span { font-size: 11px; color: var(--muted); font-weight: 400; }
.prog-sessions { padding: 10px 14px; }
.prog-session-row {
  display: flex; align-items: center; gap: 10px; padding: 6px 0;
  border-bottom: 1px solid var(--border);
}
.prog-session-row:last-child { border-bottom: none; }
.prog-date { font-size: 11px; color: var(--dim); width: 60px; flex-shrink: 0; }
.prog-sets { display: flex; gap: 5px; flex-wrap: wrap; flex: 1; }
.prog-set-pill {
  font-size: 11px; padding: 2px 7px; border-radius: 4px;
  background: var(--surface3); color: var(--muted);
}
.prog-set-pill.best { background: var(--accent-dim); color: var(--accent); }
.prog-empty {
  padding: 40px 20px; text-align: center; color: var(--dim); font-size: 13px;
}

/* ── STATS VIEW ── */
.stats-header { padding: 52px 20px 20px; border-bottom: 1px solid var(--border); }
.stats-title { font-family: 'Bebas Neue', sans-serif; font-size: 36px; letter-spacing: 1px; }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 16px 20px 0; }
.stat-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 16px;
}
.stat-val { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: .5px; color: var(--accent); }
.stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; }

.pr-section { padding: 16px 20px 0; }
.pr-title { font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin-bottom: 10px; }
.pr-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 13px 14px; margin-bottom: 8px;
  display: flex; justify-content: space-between; align-items: center;
}
.pr-name { font-size: 13px; font-weight: 500; color: var(--text); }
.pr-day { font-size: 11px; color: var(--dim); margin-top: 2px; }
.pr-weight { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: .5px; color: var(--accent); }
.pr-unit { font-size: 11px; color: var(--dim); }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: calc(var(--tab-h) + var(--safe-bottom) + 14px); left: 50%; transform: translateX(-50%) translateY(10px);
  background: var(--accent); color: #111; padding: 9px 18px;
  border-radius: 999px; font-size: 13px; font-weight: 600;
  opacity: 0; transition: all .25s; pointer-events: none; z-index: 200;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── TIP ── */
.tip-box {
  margin: 14px 20px 0; padding: 12px 14px;
  border-radius: var(--r-sm); border: 1px solid var(--border);
  background: var(--surface2); font-size: 12px; color: var(--muted);
  display: flex; gap: 8px;
}
.tip-icon { color: var(--accent); flex-shrink: 0; font-size: 14px; margin-top: 1px; }

/* ── WARM UP special ── */
.warmup-card {
  background: transparent; border: 1px solid var(--border);
  border-radius: var(--r); margin-bottom: 8px; padding: 11px 14px;
  display: flex; align-items: center; gap: 10px;
}
.warmup-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); flex-shrink: 0; }
.warmup-name { font-size: 13px; color: var(--muted); flex: 1; }
.warmup-dur { font-family: 'Bebas Neue', sans-serif; font-size: 15px; color: var(--dim); }

</style>
</head>
<body>
<div class="app">

  <!-- ═══════════════ PROGRAMME VIEW ═══════════════ -->
  <div class="view active" id="view-prog">
    <div class="header">
      <div class="header-row">
        <div>
          <div class="header-title">Programme</div>
          <div class="header-sub">Mardi · Jeudi · Vendredi · Samedi</div>
        </div>
        <div class="header-badge">KB 4J</div>
      </div>
    </div>

    <div class="day-strip" id="dayStrip">
      <div class="day-chip active" onclick="selectDay(0)">Mardi</div>
      <div class="day-chip" onclick="selectDay(1)">Jeudi</div>
      <div class="day-chip" onclick="selectDay(2)">Vendredi</div>
      <div class="day-chip" onclick="selectDay(3)">Samedi</div>
    </div>

    <div id="dayContent"></div>
  </div>

  <!-- ═══════════════ CHARGES VIEW ═══════════════ -->
  <div class="view" id="view-charges">

      <div class="prog-title">Historique</div>

    </div>

      <div class="prog-chip active" onclick="selectHistDay(0)">Mardi</div>
      <div class="prog-chip" onclick="selectHistDay(1)">Jeudi</div>
      <div class="prog-chip" onclick="selectHistDay(2)">Vendredi</div>
      <div class="prog-chip" onclick="selectHistDay(3)">Samedi</div>
    </div>
    <div id="histContent"></div>
  </div>

  <!-- ═══════════════ STATS VIEW ═══════════════ -->
  <div class="view" id="view-stats">
    <div class="stats-header">
      <div class="stats-title">Stats</div>
      <div class="prog-sub">Tes records personnels</div>
    </div>
    <div id="statsContent"></div>
  </div>

  <!-- ═══════════════ BOTTOM NAV ═══════════════ -->
  <nav class="tabnav">
    <div class="tab active" id="tab-prog" onclick="switchView('prog')">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span>Programme</span>
    </div>
    <div class="tab" id="tab-charges" onclick="switchView('charges')">
      <svg viewBox="0 0 24 24"><path d="M12 20V4M5 12l7-8 7 8"/></svg>
      <span>Charges</span>
    </div>
    <div class="tab" id="tab-stats" onclick="switchView('stats')">
      <svg viewBox="0 0 24 24"><path d="M3 20h18M5 20V12M9 20V8M13 20V4M17 20V10"/></svg>
      <span>Stats</span>
    </div>
  </nav>
</div>

<div class="toast" id="toast"></div>

        { id: 'sam_tirage', name: 'Tirage poulie haute', meta: 'Prise neutre — 3e variation de la semaine', reps: '3×10', sets: 3, tag: 'conservé' },
        { id: 'sam_tractions', name: 'Tractions (last set)', meta: 'Volume allégé — 3e session semaine', reps: '3×max', sets: 3, tag: 'conservé' },
        { id: 'sam_incline', name: 'DC incliné haltères', meta: 'Banc 30–45°, montée explosive — uppercut', reps: '4×10', sets: 4, tag: 'amélioré' },

        { id: 'sam_hollow', name: 'Hollow body hold', meta: 'Gainage de combat réel', reps: '3×30 s', sets: 0, tag: 'ajouté' },

// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════

let currentView = 'prog';
let currentDay = 0;
let currentHistDay = 0;
let openPanels = {};

function getStorage() {
  try { return JSON.parse(localStorage.getItem('kb_logs') || '{}'); } catch(e) { return {}; }
}
function setStorage(data) {
  try { localStorage.setItem('kb_logs', JSON.stringify(data)); } catch(e) {}
}

// ══════════════════════════════════════════
// VIEWS
// ══════════════════════════════════════════

function switchView(v) {
  currentView = v;
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  document.getElementById('view-' + v).classList.add('active');
  document.getElementById('tab-' + v).classList.add('active');
  if (v === 'charges') renderHist();
  if (v === 'stats') renderStats();
}

// ══════════════════════════════════════════
// PROGRAMME VIEW
// ══════════════════════════════════════════

function selectDay(i) {
  currentDay = i;
  document.querySelectorAll('#dayStrip .day-chip').forEach((c, j) => c.classList.toggle('active', j === i));
  renderDay();
}

function renderDay() {
  const day = DAYS[currentDay];
  const logs = getStorage();
  let html = '';

  // Header card
  html += `<div class="day-header-card" style="background:${day.colorDim};border-color:${day.color}22">
    <div class="day-header-icon" style="background:${day.colorDim};color:${day.color}">${day.name.slice(0,2).toUpperCase()}</div>
    <div class="day-header-info">
      <div class="day-header-title">${day.focus}</div>
      <div class="day-header-desc" style="margin-top:3px">⏱ ${day.time}</div>
    </div>
  </div>`;

  // Warmup
  html += `<div class="section"><div class="section-label">Échauffement</div>`;
  day.warmup.forEach(w => {
    html += `<div class="warmup-card"><div class="warmup-dot"></div><div class="warmup-name">${w.name}</div><div class="warmup-dur">${w.dur}</div></div>`;
  });
  html += `</div>`;

  // Blocks
  day.blocks.forEach(block => {
    html += `<div class="section"><div class="section-label">${block.label}</div>`;
    block.exercises.forEach(ex => {
      const tagColor = ex.tag === 'conservé' ? '#888' : ex.tag === 'amélioré' ? '#ff8c3a' : '#3affb8';
      const tagBg = ex.tag === 'conservé' ? 'rgba(136,136,136,0.1)' : ex.tag === 'amélioré' ? 'rgba(255,140,58,0.12)' : 'rgba(58,255,184,0.1)';
      const isLoggable = ex.sets > 0;

      html += `<div class="ex-card" id="card_${ex.id}">
        <div class="ex-main" onclick="${isLoggable ? `togglePanel('${ex.id}')` : ''}">
          <div class="ex-dot" style="background:${day.color}"></div>
          <div class="ex-body">
            <div class="ex-name">${ex.name} <span style="font-size:10px;padding:2px 6px;border-radius:4px;background:${tagBg};color:${tagColor};font-weight:500;margin-left:2px">${ex.tag}</span></div>
            <div class="ex-meta">${ex.meta}</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <div class="ex-reps">${ex.reps}</div>
            ${isLoggable ? `<svg class="ex-chevron" id="chev_${ex.id}" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>` : ''}
          </div>
        </div>
        ${isLoggable ? renderLogPanel(ex, logs) : ''}
      </div>`;
    });
    html += `</div>`;
  });

  // Tip
  html += `<div class="tip-box"><div class="tip-icon">💡</div><div>${day.tip}</div></div>`;
  html += `<div style="height:8px"></div>`;

  document.getElementById('dayContent').innerHTML = html;
}

function renderLogPanel(ex, logs) {
  const key = ex.id;
  const prev = logs[key] || [];
  const lastSession = prev.length > 0 ? prev[prev.length - 1] : null;

  let rows = '';
  for (let s = 1; s <= ex.sets; s++) {
    const lastVal = lastSession ? lastSession.sets[s-1] : null;
    const kg = lastVal ? lastVal.kg : '';
    const rep = lastVal ? lastVal.reps : '';
    rows += `<div class="log-row">
      <div class="log-set-num">${s}</div>
      <input class="log-input" id="inp_${key}_${s}_kg" type="number" inputmode="decimal" placeholder="${kg || '—'}" style="max-width:80px">
      <div class="log-label">kg</div>
      <input class="log-input" id="inp_${key}_${s}_rep" type="number" inputmode="numeric" placeholder="${rep || ex.reps.split('×')[1] || '—'}" style="max-width:70px">
      <div class="log-label">reps</div>
    </div>`;
  }

  let prevHtml = '';
  if (prev.length > 0) {
    prevHtml += `<div class="log-prev"><div class="log-prev-label">Sessions précédentes</div>`;
    const last3 = prev.slice(-3).reverse();
    last3.forEach((sess, i) => {
      const maxKg = Math.max(...sess.sets.map(s => parseFloat(s.kg)||0));
      const isNew = i === 0 && prev.length > 1 && maxKg > Math.max(...prev.slice(-4,-1).flatMap(s => s.sets.map(x => parseFloat(x.kg)||0)));
      prevHtml += `<div class="prev-row">
        <span style="font-size:11px;color:var(--dim);min-width:55px">${sess.date}</span>
        ${sess.sets.map(s => `<span class="prev-chip ${isNew&&parseFloat(s.kg)===maxKg?'pr':''}">${s.kg}kg×${s.reps}</span>`).join('')}
      </div>`;
    });
    prevHtml += `</div>`;
  }

  return `<div class="log-panel" id="panel_${key}">
    <div class="log-headers">
      <div class="log-h" style="max-width:80px;margin-left:28px">KG</div>
      <div style="width:28px"></div>
      <div class="log-h" style="max-width:70px">REPS</div>
    </div>
    ${rows}
    ${prevHtml}
    <button class="save-btn" onclick="saveLog('${key}', ${ex.sets})">Enregistrer</button>
  </div>`;
}

function togglePanel(id) {
  const panel = document.getElementById('panel_' + id);
  const chev = document.getElementById('chev_' + id);
  if (!panel) return;
  const open = panel.classList.toggle('open');
  if (chev) chev.style.transform = open ? 'rotate(180deg)' : '';
}

function saveLog(id, sets) {
  const today = new Date().toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit' });
  const setData = [];
  for (let s = 1; s <= sets; s++) {
    const kg = document.getElementById(`inp_${id}_${s}_kg`)?.value || '';
    const rep = document.getElementById(`inp_${id}_${s}_rep`)?.value || '';
    setData.push({ kg: kg || '?', reps: rep || '?' });
  }
  const logs = getStorage();
  if (!logs[id]) logs[id] = [];
  logs[id].push({ date: today, sets: setData });
  if (logs[id].length > 20) logs[id] = logs[id].slice(-20);
  setStorage(logs);
  showToast('Enregistré ✓');
  togglePanel(id);
  setTimeout(() => renderDay(), 300);
}

// ══════════════════════════════════════════
// HISTORIQUE VIEW
// ══════════════════════════════════════════

function selectHistDay(i) {
  currentHistDay = i;
  document.querySelectorAll('#histDayStrip .prog-chip').forEach((c, j) => c.classList.toggle('active', j === i));
  renderHist();
}

function renderHist() {
  const day = DAYS[currentHistDay];
  const logs = getStorage();
  let html = '<div class="prog-section">';

  const loggable = day.blocks.flatMap(b => b.exercises).filter(ex => ex.sets > 0);

  if (loggable.length === 0) {
    html += `<div class="prog-empty">Aucun exercice avec charges ce jour.</div>`;
  } else {
    loggable.forEach(ex => {
      const sessions = logs[ex.id] || [];
      html += `<div class="prog-ex-block">
        <div class="prog-ex-name">${ex.name} <span>${ex.reps}</span></div>
        <div class="prog-sessions">`;
      if (sessions.length === 0) {
        html += `<div style="font-size:12px;color:var(--dim);padding:8px 0">Pas encore de données — enregistre ta première séance !</div>`;
      } else {
        const last5 = sessions.slice(-5).reverse();
        last5.forEach(sess => {
          const maxKg = Math.max(...sess.sets.map(s => parseFloat(s.kg)||0));
          html += `<div class="prog-session-row">
            <div class="prog-date">${sess.date}</div>
            <div class="prog-sets">${sess.sets.map(s => {
              const isBest = parseFloat(s.kg) === maxKg && maxKg > 0;
              return `<span class="prog-set-pill ${isBest?'best':''}">${s.kg}×${s.reps}</span>`;
            }).join('')}</div>
          </div>`;
        });
      }
      html += `</div></div>`;
    });
  }
  html += '</div>';
  document.getElementById('histContent').innerHTML = html;
}

// ══════════════════════════════════════════
// STATS VIEW
// ══════════════════════════════════════════

function renderStats() {
  const logs = getStorage();
  const allExercises = DAYS.flatMap(d => d.blocks.flatMap(b => b.exercises).filter(ex => ex.sets > 0).map(ex => ({ ...ex, day: d.name })));

  const totalSessions = Object.values(logs).reduce((acc, v) => acc + v.length, 0);
  const totalSets = Object.values(logs).reduce((acc, v) => acc + v.reduce((a, sess) => a + sess.sets.length, 0), 0);

  // PRs
  const prs = [];
  allExercises.forEach(ex => {
    const sessions = logs[ex.id] || [];
    if (sessions.length === 0) return;
    let best = 0;
    sessions.forEach(sess => {
      sess.sets.forEach(s => { const kg = parseFloat(s.kg)||0; if (kg > best) best = kg; });
    });
    if (best > 0) prs.push({ name: ex.name, day: ex.day, kg: best });
  });
  prs.sort((a, b) => b.kg - a.kg);

  let html = `<div class="stats-grid">
    <div class="stat-card"><div class="stat-val">${totalSessions}</div><div class="stat-label">Sessions logguées</div></div>
    <div class="stat-card"><div class="stat-val">${totalSets}</div><div class="stat-label">Séries au total</div></div>
  </div>`;

  html += `<div class="pr-section"><div class="pr-title">Records personnels (max charge)</div>`;
  if (prs.length === 0) {
    html += `<div class="prog-empty">Enregistre tes premières charges pour voir tes PRs ici !</div>`;
  } else {
    prs.forEach(pr => {
      html += `<div class="pr-card">
        <div><div class="pr-name">${pr.name}</div><div class="pr-day">${pr.day}</div></div>
        <div style="text-align:right"><div class="pr-weight">${pr.kg}</div><div class="pr-unit">kg</div></div>
      </div>`;
    });
  }
  html += `</div>`;

  document.getElementById('statsContent').innerHTML = html;
}

// ══════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════

renderDay();
</script>
</body>
</html>
